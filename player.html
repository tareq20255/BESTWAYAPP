<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>مشغّل الشاشة · BESTWAY</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
/* صفحة تعمل على متصفحات أندرويد قديمة: بدون inset ولا gap ولا clamp */
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  -webkit-user-select:none;user-select:none}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;background:#000}
.layer{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;-webkit-transition:opacity .6s ease;transition:opacity .6s ease;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:#000}
.layer.show{opacity:1}
.layer img,.layer video{width:100%;height:100%;object-fit:contain;display:block}
.layer iframe{border:0;width:100%;height:100%;background:#fff}
.layer.text{padding:6vmin;text-align:center;font-weight:700;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;box-sizing:border-box}
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;display:none;-webkit-flex-direction:column;flex-direction:column;
  -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;
  background:#0b1620;padding:5vmin;box-sizing:border-box}
#overlay.on{display:-webkit-flex;display:flex}
#overlay h1{margin:0 0 2vmin;font-size:5vmin;font-weight:600}
#overlay p{margin:1vmin 0;font-size:3.2vmin;opacity:.8}
#code{font-size:16vmin;font-weight:800;letter-spacing:2vmin;direction:ltr;margin:3vmin 0;color:#6ee7b7}
#clock{font-size:7vmin;font-weight:300;margin-top:3vmin;direction:ltr}
#net{position:fixed;bottom:6px;left:6px;width:9px;height:9px;border-radius:50%;background:#ef4444;z-index:9;display:none}
#net.on{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="overlay"></div>
<div id="net" title="مفيش اتصال بالإنترنت"></div>
<script src="src/signage-config.js"></script>
<script>
// مشغّل شاشة العرض. مكتوب بصياغة ES5 و XMLHttpRequest ليعمل على WebView قديم.
// يسأل القاعدة كل دقيقة عن قائمة العرض (الدالة sg_player_poll)، ويكمل على آخر قائمة لو انقطع الإنترنت.
(function () {
  'use strict';
  var PLAYER_VERSION = '1.18.1'; // يُرفع مع كل إصدار: الشاشات تعيد تحميل الصفحة لما تلاقي رقم مختلف على السيرفر
  var CFG = window.SIGNAGE_CONFIG;
  var POLL_MS = 60000;             // الشاشة المربوطة
  var PAIR_FAST_MS = 5000;         // في انتظار الربط: أول عشر دقائق
  var PAIR_SLOW_MS = 30000;        // بعدها
  var PAIR_FAST_FOR_MS = 600000;
  var RETRY_MS = 15000;            // بعد فشل الاتصال
  var UPDATE_CHECK_MS = 6 * 3600000;
  var ID_RE = /^[A-Za-z0-9_-]{16,64}$/;
  var K_DEVICE = 'bw-signage:device';
  var K_PLAYLIST = 'bw-signage:playlist';

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* التخزين غير متاح */ } }
  function $(id) { return document.getElementById(id); }
  function newId() {
    var s = '', i;
    try {
      var a = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      for (i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2);
    } catch (e) {
      s = '';
      while (s.length < 32) s += Math.floor(Math.random() * 16).toString(16);
    }
    return s;
  }

  var stage = $('stage'), overlay = $('overlay');
  var HB = param('hb') !== '0';   // hb=0: معاينة من الإدارة، لا تُحسب اتصالًا من الشاشة
  var urlDevice = param('d');     // رابط خاص بشاشة محددة بدل الكود
  var deviceId = null;
  var items = [];
  var version = null;
  var screenName = '';
  var cur = -1;
  var timer = null, guard = null, pollTimer = null, clockTimer = null;
  var curAdvance = null;          // ينقل للعنصر التالي (خاص بالعنصر المعروض الآن)
  var curVideo = null;            // عنصر الفيديو المعروض الآن، إن وُجد
  var fails = 0;
  var pairSince = 0;
  var lastUpdateCheck = Date.now();

  if (param('reset') === '1') {
    lsSet(K_DEVICE, ''); lsSet(K_PLAYLIST, '');
    location.replace(location.pathname);
    return;
  }

  // ---------- العرض ----------
  function kill(layer) {
    try {
      var v = layer.querySelector('video');
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
      var f = layer.querySelector('iframe');
      if (f) f.src = 'about:blank';
    } catch (e) { /* تجاهل */ }
    if (layer.parentNode) layer.parentNode.removeChild(layer);
  }
  function layers() { return [].slice.call(stage.children); }
  function reveal(layer) {
    var old = layers().filter(function (l) { return l !== layer; });
    var go = function () { layer.className += ' show'; };
    if (window.requestAnimationFrame) requestAnimationFrame(function () { requestAnimationFrame(go); }); else go();
    setTimeout(function () { old.forEach(kill); }, 800);
    hideOverlay();
    // حمّل الصورة التالية مسبقًا
    var nx = items[(cur + 1) % items.length];
    if (nx && nx.type === 'image' && items.length > 1) { var im = new Image(); im.src = nx.url; }
  }
  function clearTimers() { clearTimeout(timer); clearTimeout(guard); timer = guard = null; }
  function stopPlayback() {
    clearTimers();
    layers().forEach(kill);
    cur = -1; curAdvance = null; curVideo = null;
  }
  function textSize(len) { return len > 220 ? '4.2vmin' : len > 120 ? '5.5vmin' : len > 60 ? '7vmin' : '10vmin'; }

  function next() {
    clearTimers();
    if (!items.length) { showEmpty(); return; }
    cur = (cur + 1) % items.length;
    show(items[cur]);
  }

  function show(item) {
    var single = items.length === 1;
    var layer = document.createElement('div');
    layer.className = 'layer';
    var advanced = false;
    var advance = function () { if (advanced) return; advanced = true; next(); };
    curAdvance = advance; curVideo = null;
    // عنصر لم يُحمَّل (ملف محذوف أو إنترنت مقطوع): نتخطاه بعد لحظة
    var failLayer = function () { kill(layer); clearTimers(); timer = setTimeout(advance, 2500); };
    var el;

    if (item.type === 'image') {
      el = new Image();
      el.style.objectFit = item.fit === 'cover' ? 'cover' : 'contain';
      el.onload = function () { reveal(layer); if (!single) timer = setTimeout(advance, item.duration * 1000); };
      el.onerror = failLayer;
      layer.appendChild(el); stage.appendChild(layer);
      el.src = item.url;
    } else if (item.type === 'video') {
      el = document.createElement('video');
      curVideo = el;
      el.muted = true; el.defaultMuted = true; el.autoplay = true; el.preload = 'auto';
      el.setAttribute('playsinline', ''); el.setAttribute('muted', '');
      el.style.objectFit = item.fit === 'cover' ? 'cover' : 'contain';
      if (single) el.loop = true;
      el.onplaying = function () { clearTimeout(guard); reveal(layer); };
      el.onloadedmetadata = function () {
        if (single) return;
        clearTimeout(guard);
        var d = isFinite(el.duration) && el.duration > 0 ? el.duration : 600;
        guard = setTimeout(advance, (d + 15) * 1000); // حماية لو الفيديو توقف في المنتصف
      };
      el.onended = advance;
      el.onerror = failLayer;
      layer.appendChild(el); stage.appendChild(layer);
      guard = setTimeout(advance, 20000); // لو الفيديو لم يبدأ أصلًا
      el.src = item.url;
      var p = el.play(); if (p && p.then) p.then(null, function () { /* المتصفح يشغّله بـ autoplay */ });
    } else if (item.type === 'text') {
      layer.className = 'layer text';
      layer.style.background = item.bg || '#111';
      layer.style.color = item.fg || '#fff';
      layer.style.fontSize = textSize((item.text || '').length);
      layer.textContent = item.text || '';
      stage.appendChild(layer);
      reveal(layer);
      if (!single) timer = setTimeout(advance, item.duration * 1000);
    } else if (item.type === 'url') {
      el = document.createElement('iframe');
      el.setAttribute('allow', 'autoplay; fullscreen');
      el.onload = function () { reveal(layer); };
      layer.appendChild(el); stage.appendChild(layer);
      el.src = item.url;
      guard = setTimeout(function () { reveal(layer); }, 4000);
      if (!single) timer = setTimeout(advance, item.duration * 1000);
    } else { advance(); }
  }

  function sameItem(a, b) { return a && b && a.id === b.id && a.updated === b.updated; }
  function applyPlaylist(newItems) {
    var curItem = (cur >= 0 && items[cur]) ? items[cur] : null;
    var wasSingle = items.length === 1;
    items = newItems || [];
    if (!items.length) { stopPlayback(); showEmpty(); return; }
    if (curItem) {
      for (var i = 0; i < items.length; i++) {
        if (sameItem(items[i], curItem)) {
          cur = i; // العنصر المعروض ما زال في القائمة: نكمل بلا قطع
          if (wasSingle && items.length > 1) resumeRotation(curItem);
          return;
        }
      }
    }
    stopPlayback();
    next();
  }
  // العنصر الوحيد في القائمة يُعرض بلا موعد انتقال (والفيديو يتكرر). لما تُضاف له عناصر
  // نحدد موعد انتقاله الآن، وإلا بقيت الشاشة عليه حتى إعادة التحميل
  function resumeRotation(item) {
    clearTimers();
    if (item.type === 'video' && curVideo) {
      curVideo.loop = false; // يكمل دورته الحالية ثم ينتقل عند انتهائه
      var left = isFinite(curVideo.duration) && curVideo.duration > 0 ? curVideo.duration - curVideo.currentTime : 600;
      guard = setTimeout(curAdvance, (left + 15) * 1000);
    } else {
      timer = setTimeout(curAdvance, item.duration * 1000);
    }
  }
  // صف القاعدة ← عنصر عرض: الملف يتحول لرابطه العام في المخزن
  function mediaUrl(file) {
    var parts = String(file).split('/'), i;
    for (i = 0; i < parts.length; i++) parts[i] = encodeURIComponent(parts[i]);
    return CFG.url.replace(/\/+$/, '') + '/storage/v1/object/public/' + CFG.bucket + '/' + parts.join('/');
  }
  function toItems(rows) {
    var out = [], i, r;
    for (i = 0; i < (rows || []).length; i++) {
      r = rows[i];
      out.push({
        id: r.id, type: r.type, updated: r.updated,
        url: r.type === 'url' ? r.url : (r.file ? mediaUrl(r.file) : null),
        text: r.text, bg: r.bg, fg: r.fg, fit: r.fit, duration: Math.max(2, Number(r.duration) || 10)
      });
    }
    return out;
  }

  // ---------- الشاشات الجانبية ----------
  function isPairing() { return !!overlay.querySelector('#code'); }
  function hideOverlay() { overlay.className = ''; clearInterval(clockTimer); clockTimer = null; }
  function clockText() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function showEmpty() {
    overlay.className = 'on';
    overlay.innerHTML = '<h1></h1><p>مفيش محتوى معروض دلوقتي</p><div id="clock"></div>';
    overlay.querySelector('h1').textContent = screenName || '';
    var upd = function () { var c = $('clock'); if (c) c.textContent = clockText(); };
    upd(); clearInterval(clockTimer); clockTimer = setInterval(upd, 15000);
  }
  function showPair(code) {
    stopPlayback(); items = []; version = null;
    lsSet(K_PLAYLIST, '');
    clearInterval(clockTimer);
    overlay.className = 'on';
    if (!isPairing()) {
      overlay.innerHTML = '<h1>ربط الشاشة</h1><p>افتح تطبيق BESTWAY ← الشاشات ← ربط شاشة جديدة</p><p>واكتب الكود ده:</p><div id="code"></div>';
    }
    overlay.querySelector('#code').textContent = code;
  }
  function showError(msg) {
    stopPlayback();
    clearInterval(clockTimer);
    overlay.className = 'on';
    overlay.innerHTML = '<h1></h1>';
    overlay.querySelector('h1').textContent = msg;
  }

  // ---------- الاتصال ----------
  function setNet(ok) { $('net').className = ok ? '' : 'on'; }
  function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

  function handle(data) {
    fails = 0; setNet(true);
    if (!data.paired) {
      if (!pairSince) pairSince = Date.now();
      showPair(data.code);
      schedule(Date.now() - pairSince < PAIR_FAST_FOR_MS ? PAIR_FAST_MS : PAIR_SLOW_MS);
      return;
    }
    pairSince = 0;
    screenName = data.name || '';
    var wasPairing = isPairing();
    if (wasPairing) { overlay.innerHTML = ''; hideOverlay(); }
    if (data.version !== version || wasPairing) {
      version = data.version;
      lsSet(K_PLAYLIST, JSON.stringify({ device: deviceId, name: screenName, version: version, items: data.items }));
      applyPlaylist(toItems(data.items));
    }
    schedule(POLL_MS);
    if (Date.now() - lastUpdateCheck > UPDATE_CHECK_MS) { lastUpdateCheck = Date.now(); checkUpdate(); }
  }
  function offline() {
    fails++;
    if (fails >= 2) setNet(false);
    schedule(RETRY_MS);
  }
  // رفض من القاعدة (وليس انقطاعًا): الحالة الوحيدة المتوقعة هي امتلاء قائمة الأكواد المنتظرة
  function rejected(data) {
    var msg = data && data.message ? String(data.message) : '';
    if (msg.indexOf('too many pending') !== -1 && !items.length) {
      showError('في شاشات كتير مستنية الربط. امسح الأكواد من تطبيق BESTWAY (الشاشات ← مسح الأكواد).');
      schedule(POLL_MS);
      return;
    }
    offline();
  }

  function poll() {
    var x = new XMLHttpRequest();
    var done = false;
    var once = function (fn) { return function () { if (done) return; done = true; fn(); }; };
    x.open('POST', CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/sg_player_poll', true);
    x.setRequestHeader('apikey', CFG.key);
    x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 20000;
    x.onload = once(function () {
      var data = null;
      try { data = JSON.parse(x.responseText); } catch (e) { data = null; }
      if (x.status === 200 && data && typeof data.paired === 'boolean') handle(data);
      else if (x.status >= 400 && x.status < 500) rejected(data);
      else offline();
    });
    x.onerror = once(offline);
    x.ontimeout = once(offline);
    x.send(JSON.stringify({ p_device_id: deviceId, p_hb: HB }));
  }

  // إصدار جديد من الصفحة على السيرفر؟ أعد التحميل لتأخذه الشاشة بلا تدخل
  function checkUpdate() {
    var x = new XMLHttpRequest();
    x.open('GET', location.pathname, true);
    x.onload = function () {
      if (x.status !== 200) return;
      var m = /PLAYER_VERSION = '([^']+)'/.exec(x.responseText);
      if (m && m[1] !== PLAYER_VERSION) location.reload();
    };
    x.send();
  }

  // ---------- أمان التشغيل ----------
  function wakeLock() {
    try {
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then(null, function () { /* غير مسموح: الكشك يتكفل بإبقاء الشاشة */ });
    } catch (e) { /* تجاهل */ }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wakeLock(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  wakeLock();
  // الـ Service Worker يحفظ الصفحة نفسها، فتفتح الشاشة حتى لو الإنترنت لسه ماوصلش وقت التشغيل
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').then(null, function () { /* تجاهل */ }); });
  }

  // ---------- البداية ----------
  if (!CFG || !CFG.url || !CFG.key) { showError('إعدادات الاتصال ناقصة (src/signage-config.js)'); return; }
  if (urlDevice && !ID_RE.test(urlDevice)) { showError('الرابط ده غير صحيح. انسخه تاني من تطبيق BESTWAY.'); return; }
  deviceId = urlDevice || lsGet(K_DEVICE);
  if (!deviceId || !ID_RE.test(deviceId)) { deviceId = newId(); lsSet(K_DEVICE, deviceId); }

  // ابدأ فورًا بآخر قائمة محفوظة لنفس الشاشة، ثم حدّثها من القاعدة
  try {
    var cached = JSON.parse(lsGet(K_PLAYLIST) || 'null');
    if (cached && cached.device === deviceId && cached.items && cached.items.length) {
      screenName = cached.name || '';
      version = cached.version;
      applyPlaylist(toItems(cached.items));
    }
  } catch (e) { /* قائمة تالفة: نتجاهلها */ }

  poll();
})();
</script>
</body>
</html>
