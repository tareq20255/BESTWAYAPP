<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<meta name="mobile-web-app-capable" content="yes">
<title>الشاشات · BESTWAY</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- نفس خط التطبيق الرئيسي؛ لو لم يُحمَّل يُستخدم خط النظام -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* لوحة تحكم شاشات العرض: صفحة واحدة للموبايل، بطاقات وتبويبات سفلية ونوافذ منبثقة من أسفل */
:root{
  color-scheme:light;
  --bg:#f6f3ec; --card:#fff; --ink:#18211d; --mute:#64706a; --line:#e3dfd5;
  --accent:#1f6f54; --accent-ink:#fff; --danger:#b91c1c; --ok:#16a34a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{margin:0;font-size:18px}
.top .acts{display:flex;gap:8px}
.top button,.top a{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;
  text-decoration:none;font-size:14px}
main{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.tabs{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;color:var(--mute);cursor:pointer;font-size:13px}
.tabs button b{display:block;font-size:20px;line-height:1.1;font-weight:400}
.tabs button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:16px}
.sub{color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;padding:12px;margin-top:6px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.fab{width:100%;margin:0 0 12px;padding:12px;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#c9cdc9;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.2)}
.chip{display:inline-block;background:#efece4;border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 0 0 4px}
.chip.t{background:#e2f0ea;color:#17533f}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.code{background:#e2f0ea;color:#17533f;font-weight:700;letter-spacing:2px;cursor:pointer;border:0;font-size:15px}
.thumb{width:64px;height:64px;border-radius:10px;background:#e3dfd5;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.help ol{margin:8px 0 0;padding-inline-start:22px}
.help li{margin:4px 0}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 0}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],input[type=url],select,textarea{
  width:100%;margin-top:4px;padding:10px 12px;border:1px solid #cfcabd;border-radius:10px;background:#fff;color:var(--ink)}
input[type=color]{width:100%;height:42px;margin-top:4px;border:1px solid #cfcabd;border-radius:10px;background:#fff;padding:2px}
textarea{min-height:90px;resize:vertical}
input[type=file]{width:100%;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{flex:1;min-width:70px;padding:9px 6px;border:1px solid #cfcabd;background:#fff;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.days{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.days button{padding:6px 9px;border:1px solid #cfcabd;background:#fff;border-radius:99px;cursor:pointer;font-size:13px}
.days button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rule{border:1px dashed #a9a596;border-radius:12px;padding:10px 12px;margin-top:12px;background:#fbfaf6}
.rule-head{display:flex;justify-content:space-between;align-items:center}
.hint{font-size:12.5px;color:var(--mute);margin-top:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:0 0 env(safe-area-inset-bottom)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid var(--line);z-index:1}
.sheet-head h2{margin:0;font-size:18px}
.sheet-body{padding:6px 16px 18px}
.sheet-foot{position:sticky;bottom:0;background:var(--bg);padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1;padding:12px}
.modal{z-index:60;align-items:center}
.modal .sheet{max-width:380px;margin:0 16px;border-radius:18px}
.modal .sheet-body{padding:18px}
.bar{height:8px;background:#e3dfd5;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.toast{position:fixed;bottom:84px;inset-inline:16px;margin:auto;max-width:420px;background:#18211d;color:#fff;padding:11px 14px;
  border-radius:12px;z-index:80;text-align:center;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
.login{max-width:380px;margin:10vh auto 0;padding:0 16px}
.login .card{padding:20px}
.login h1{margin:0 0 4px;font-size:22px}
.login .back{display:block;text-align:center;margin-top:14px;font-size:14px}
.err-msg{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px}
code.url{direction:ltr;unicode-bidi:plaintext;background:#efece4;padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
/* معاينة الشاشة */
.tv{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;container-type:inline-size;
  box-shadow:0 0 0 6px #232b27,0 10px 26px rgba(20,28,24,.35);margin:12px 6px 16px}
.lay{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;display:flex;align-items:center;justify-content:center;flex-direction:column}
.lay img,.lay video{width:100%;height:100%;display:block}
.txt{font-size:clamp(16px,6cqw,60px);font-weight:700;text-align:center;padding:6cqw;white-space:pre-line;line-height:1.5}
.clock{font-size:14cqw;font-weight:300;letter-spacing:.04em;direction:ltr;line-height:1.1}
.plrow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.plrow.now{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,84,.18)}
.plrow .thumb{width:46px;height:46px;font-size:18px}
@media (prefers-reduced-motion:reduce){.lay,.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"><div class="empty">جاري التحميل…</div></div>
<div id="sheets"></div>
<script src="src/signage-config.js"></script>
<script src="src/signage-core.js"></script>
<script src="src/signage-api.js"></script>
<script>
'use strict';
const Core = window.SignageCore;
const client = window.SignageApi.createClient(window.SIGNAGE_CONFIG);
const PLAYER_URL = new URL('player.html', location.href).href;
const LIVE_REFRESH_MS = 20000;

const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYNAME = Object.fromEntries(Core.DAYS);
const TYPES = { image: ['🖼️', 'صورة'], video: ['🎬', 'فيديو'], text: ['📝', 'نص'], url: ['🔗', 'رابط'] };

let S = null;          // حالة النظام: الفروع والأماكن والشاشات والأكواد المنتظرة والمحتوى
let tab = 'screens';
let sheetOpen = false;
let player = null;     // معاينة الشاشة الجارية

// ---------- أدوات ----------
let toastTimer;
function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), isErr ? 5000 : 2400);
}
function fail(e) {
  if (e && e.kind === 'auth') { S = null; showLogin('انتهت الجلسة. سجّل الدخول من جديد.'); return; }
  if (!(e && (e.kind || e.code || e.status))) console.error(e);
  toast(Core.errorText(e), true);
}
function options(list, sel, allLabel) {
  return `<option value="">${esc(allLabel)}</option>` +
    list.map((x) => `<option value="${x.id}"${String(x.id) === String(sel) ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
}
const nameOf = (list, id) => { const x = list.find((i) => i.id === id); return x ? x.name : null; };
const screenById = (id) => S.screens.find((s) => s.id === id);
const linkFor = (deviceId) => `${PLAYER_URL}?d=${encodeURIComponent(deviceId)}`;
const nowCount = (screen) => Core.playlistFor(S.content, screen, Core.nowParts(Date.now(), S.tz)).length;
async function refresh() { S = await client.loadState(); render(); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('اتنسخ'); }
  catch (e) { showText('انسخ الرابط:', text); }
}

// ---------- الدخول ----------
function shell(inner) {
  closeSheet();
  $('#app').innerHTML = `<div class="login"><div class="card">${inner}<a class="back" href="./">‹ رجوع للتطبيق</a></div></div>`;
}
function showLogin(note) {
  shell(`
    <h1>شاشات العرض</h1>
    <div class="sub">ادخل بحساب BESTWAY (نفس مستخدم Supabase)</div>
    <form id="lf" novalidate>
      <label for="em">الإيميل</label><input type="email" id="em" dir="ltr" autocomplete="username" inputmode="email">
      <label for="pw">كلمة السر</label><input type="password" id="pw" dir="ltr" autocomplete="current-password">
      <div class="err-msg" id="lerr" role="alert">${esc(note || '')}</div>
      <button class="btn primary wide" id="lbtn">دخول</button>
    </form>`);
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#em').value.trim();
    const password = $('#pw').value;
    if (!email || !password) { $('#lerr').textContent = 'اكتب الإيميل وكلمة السر'; return; }
    $('#lbtn').disabled = true;
    try { await client.signIn(email, password); await boot(); }
    catch (err) { $('#lbtn').disabled = false; $('#lerr').textContent = Core.errorText(err); }
  };
}
async function boot() {
  if (!client.hasSession()) { showLogin(); return; }
  try {
    if (!(await client.isAdmin())) {
      shell(`<h1>الحساب ده مش مدير للشاشات</h1>
        <div class="sub">الدخول نجح، لكن الحساب مش مضاف في قائمة مديري الشاشات (جدول sg_admins).</div>
        <button class="btn wide" data-act="logout">خروج والدخول بحساب تاني</button>`);
      return;
    }
    S = await client.loadState();
    render();
  } catch (e) {
    if (e.kind === 'auth') { showLogin('انتهت الجلسة. سجّل الدخول من جديد.'); return; }
    shell(`<h1>تعذّر التحميل</h1><div class="sub">${esc(Core.errorText(e))}</div>
      <button class="btn primary wide" data-act="retry">إعادة المحاولة</button>`);
  }
}

// ---------- الواجهة الرئيسية ----------
function render() {
  if (!S) return;
  const titles = { screens: 'الشاشات', content: 'المحتوى', setup: 'الفروع والأماكن' };
  $('#app').innerHTML = `
    <div class="top"><h1>${titles[tab]}</h1>
      <div class="acts"><a href="./">‹ التطبيق</a><button type="button" data-act="logout">خروج</button></div></div>
    <main>${tab === 'screens' ? viewScreens() : tab === 'content' ? viewContent() : viewSetup()}</main>
    <nav class="tabs">
      <button type="button" data-tab="screens" class="${tab === 'screens' ? 'on' : ''}"><b>🖥️</b>الشاشات</button>
      <button type="button" data-tab="content" class="${tab === 'content' ? 'on' : ''}"><b>🎞️</b>المحتوى</button>
      <button type="button" data-tab="setup" class="${tab === 'setup' ? 'on' : ''}"><b>⚙️</b>الإعداد</button>
    </nav>`;
}

function viewScreens() {
  const now = Date.now();
  const pend = S.pending.length
    ? `<div class="card"><div class="row sp"><h3>شاشات مستنية الربط</h3><button class="btn sm" data-act="clearpending">مسح الأكواد</button></div>
       <div class="sub">دوس على الكود اللي ظاهر على الشاشة</div>
       <div style="margin-top:8px">${S.pending.map((p) => `<button class="chip code" data-act="pair" data-code="${esc(p.code)}">${esc(p.code)}</button>`).join('')}</div></div>`
    : '';
  const help = !S.screens.length ? `
    <div class="card help"><h3>ابدأ من هنا</h3><ol>
      <li>من تبويب <b>الإعداد</b> أضف الفروع وأماكن الشاشات (كاشير، صالة…).</li>
      <li>على كل شاشة أندرويد افتح الرابط ده، وهيظهر كود من 6 أرقام:
        <div style="margin-top:6px"><code class="url">${esc(PLAYER_URL)}</code></div></li>
      <li>اضغط <b>ربط شاشة جديدة</b> هنا واكتب الكود واختار الفرع والمكان.</li>
      <li>من تبويب <b>المحتوى</b> ارفع الصور والفيديوهات وحدد تظهر فين وإمتى.</li>
    </ol></div>` : '';
  const list = S.screens.map((s) => `
    <div class="card">
      <div class="row"><span class="dot ${Core.isOnline(s.last_seen, now) ? 'on' : ''}"></span>
        <div class="grow"><h3>${esc(s.name)}</h3>
        <div class="sub">${esc(nameOf(S.branches, s.branch_id) || 'بدون فرع')} · ${esc(nameOf(S.locations, s.location_id) || 'بدون مكان')}</div>
        <div class="sub">${esc(Core.agoText(s.last_seen, now))}</div>
        <div class="sub">▶ بتعرض دلوقتي: ${nowCount(s)} عنصر</div></div></div>
      <div class="row wrap" style="margin-top:10px">
        <button class="btn sm" data-act="preview" data-id="${s.id}">معاينة</button>
        <button class="btn sm" data-act="copylink" data-id="${s.id}">نسخ الرابط</button>
        <button class="btn sm" data-act="editscreen" data-id="${s.id}">تعديل</button>
        <button class="btn sm danger" data-act="delscreen" data-id="${s.id}">حذف</button>
      </div>
    </div>`).join('');
  return `${pend}<button class="btn primary fab" data-act="pair">＋ ربط شاشة جديدة</button>${help}${list}
    <div class="sub" style="text-align:center;margin-top:8px">توقيت الجدولة: ${esc(S.tz)}</div>`;
}

function thumbFor(c) {
  if (c.type === 'image') return `<img src="${esc(client.publicUrl(c.file))}" alt="" loading="lazy">`;
  if (c.type === 'video') return `<video src="${esc(client.publicUrl(c.file))}#t=0.5" preload="metadata" muted playsinline></video>`;
  if (c.type === 'text') return `<span style="background:${esc(c.bg)};color:${esc(c.fg)};width:100%;height:100%;display:flex;align-items:center;justify-content:center">Aa</span>`;
  return TYPES.url[0];
}
function viewContent() {
  const list = S.content.map((c) => {
    const rules = c.rules.length ? c.rules.map((r) => {
      const x = Core.ruleSummary(r, S);
      return `<div><span class="chip t">${esc(x.where)}</span>${x.when ? `<span class="chip">${esc(x.when)}</span>` : ''}</div>`;
    }).join('') : '<span class="chip warn">مش بيظهر على أي شاشة (مفيش قواعد عرض)</span>';
    return `<div class="card" style="${c.enabled ? '' : 'opacity:.6'}">
      <div class="row">
        <div class="thumb">${thumbFor(c)}</div>
        <div class="grow"><h3>${esc(c.title)}</h3>
          <div class="sub">${TYPES[c.type][1]}${c.type !== 'video' ? ` · ${c.duration} ثانية` : ''}${c.enabled ? '' : ' · متوقف'}</div></div>
      </div>
      <div style="margin-top:8px">${rules}</div>
      <div class="row wrap" style="margin-top:10px">
        <button class="btn sm" data-act="editcontent" data-id="${c.id}">تعديل / أماكن العرض</button>
        <button class="btn sm" data-act="togglecontent" data-id="${c.id}">${c.enabled ? 'إيقاف' : 'تشغيل'}</button>
        <button class="btn sm danger" data-act="delcontent" data-id="${c.id}">حذف</button>
      </div>
    </div>`;
  }).join('');
  return `<button class="btn primary fab" data-act="newcontent">＋ محتوى جديد</button>
    ${list || '<div class="empty">مفيش محتوى لسه. اضغط "محتوى جديد" وارفع أول صورة أو فيديو.</div>'}`;
}

function viewSetup() {
  const block = (kind, label, list) => `
    <div class="card"><h3>${label}</h3>
      ${list.map((x) => `<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <span>${esc(x.name)}</span>
        <span class="row"><button class="btn sm" data-act="ren" data-kind="${kind}" data-id="${x.id}">تعديل</button>
        <button class="btn sm danger" data-act="del" data-kind="${kind}" data-id="${x.id}">حذف</button></span></div>`).join('') || '<div class="sub">لسه مفيش</div>'}
      <form data-addform="${kind}" class="row" style="margin-top:12px">
        <input type="text" id="add-${kind}" class="grow" aria-label="${kind === 'branches' ? 'اسم فرع جديد' : 'اسم مكان جديد'}"
          placeholder="${kind === 'branches' ? 'اسم فرع جديد' : 'اسم مكان جديد (كاشير، صالة…)'}" maxlength="80" style="margin:0">
        <button class="btn primary">إضافة</button></form>
    </div>`;
  return block('branches', 'الفروع', S.branches) + block('locations', 'أماكن الشاشات', S.locations) +
    `<div class="card"><h3>رابط المشغّل</h3><div class="sub">افتحه على كل شاشة أندرويد، أو حطه صفحة بداية في متصفح الكشك:</div>
     <div style="margin-top:8px"><code class="url">${esc(PLAYER_URL)}</code></div>
     <button class="btn sm" style="margin-top:10px" data-act="copyplayer">نسخ الرابط</button>
     <div class="hint">لو متصفح الشاشة بيمسح بياناته مع كل تشغيل، استخدم «نسخ الرابط» من بطاقة الشاشة نفسها: ده رابط ثابت مش محتاج كود.</div></div>`;
}

// ---------- النوافذ ----------
function openSheet(title, bodyHtml, footHtml) {
  closeSheet();
  sheetOpen = true;
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="btn sm" data-act="closesheet">إغلاق</button></div>
    <div class="sheet-body">${bodyHtml}</div>${footHtml ? `<div class="sheet-foot">${footHtml}</div>` : ''}</div>`;

// ----- محتوى جديد / تعديل -----
// صور الكاميرا كبيرة بلا داعٍ لشاشة عرض: نصغّر JPEG إلى 1920 بكسل للضلع الأطول لتقليل استهلاك الإنترنت
async function shrinkJpeg(file) {
  if (file.type !== 'image/jpeg' || file.size < 400 * 1024) return file;
  let objectUrl;
  try {
    objectUrl = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = objectUrl; });
    const scale = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
    return blob && blob.size < file.size * 0.9 ? blob : file;
  } catch (e) {
    return file; // أي فشل: نرفع الأصل كما هو
  } finally {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
  }
}

// يشغّل العناصر بالتبادل داخل إطار التلفزيون، بنفس ترتيب ومدد الشاشة الحقيقية
function makePlayer(tv, items, getSpeed, onStep, clockText) {
  let alive = true, timer = null, idx = -1, cur = null;
  function layer(it) {
    const d = document.createElement('div'); d.className = 'lay';
    if (it.type === 'image') { d.style.background = '#000'; d.innerHTML = `<img alt="" src="${esc(client.publicUrl(it.file))}" style="object-fit:${esc(it.fit)}">`; }
    else if (it.type === 'video') { d.style.background = '#000'; d.innerHTML = `<video muted playsinline autoplay ${items.length === 1 ? 'loop' : ''} src="${esc(client.publicUrl(it.file))}" style="object-fit:${esc(it.fit)}"></video>`; }
    else if (it.type === 'text') { d.style.background = it.bg; d.style.color = it.fg; d.innerHTML = `<div class="txt">${esc(it.text)}</div>`; }
    else {
      let host = it.url; try { host = new URL(it.url).host; } catch (e) { /* يبقى النص كما هو */ }
      d.style.background = '#232b27'; d.style.color = '#e6ebe8';
      d.innerHTML = `<div class="txt" style="font-weight:400">🔗 صفحة ويب<br><span dir="ltr" style="font-size:.6em">${esc(host)}</span><br><span style="font-size:.5em;opacity:.7">بتتعرض كاملة على الشاشة الحقيقية</span></div>`;
    }
    return d;
  }
  function show() {
    if (!alive) return;
    if (!items.length) {
      tv.innerHTML = `<div class="lay" style="opacity:1;background:#0b1620;color:#e6ebe8"><div class="clock">${esc(clockText)}</div><div class="txt" style="font-size:3.2cqw;font-weight:400;padding:0;opacity:.7">مفيش محتوى مجدول دلوقتي</div></div>`;
      onStep(-1, null); return;
    }
    idx = (idx + 1) % items.length;
    const it = items[idx], el = layer(it);
    tv.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = 1; }));
    const old = cur; cur = el;
    if (old) { old.style.opacity = 0; setTimeout(() => old.remove(), 800); }
    onStep(idx, it);
    if (items.length === 1) return;
    let ms = it.duration * 1000 / getSpeed();
    if (it.type === 'video') {
      const video = el.querySelector('video');
      video.onended = () => { clearTimeout(timer); show(); };
      video.onerror = () => { clearTimeout(timer); timer = setTimeout(show, 2500); };
      ms = 10 * 60 * 1000; // الفيديو يتقدّم عند انتهائه؛ هذه حماية فقط
    }
    timer = setTimeout(show, ms);
  }
  tv.innerHTML = '';
  show();
  return { stop() { alive = false; clearTimeout(timer); tv.querySelectorAll('video').forEach((x) => x.pause()); } };
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const id = Number(t.dataset.id);
  try {
    switch (t.dataset.act) {
      case 'logout': await client.signOut(); S = null; showLogin(); break;
      case 'retry': await boot(); break;
      case 'closesheet': closeSheet(); break;
      case 'pair': screenSheet(null, t.dataset.code); break;
      case 'clearpending':
        if (await askConfirm('تمسح كل الأكواد المنتظرة؟ أي شاشة لسه مفتوحة على صفحة الكود هتاخد كود جديد.', 'مسح')) { await client.clearPending(); await refresh(); }
        break;
      case 'editscreen': screenSheet(screenById(id)); break;
      case 'delscreen':
        if (await askConfirm('تحذف الشاشة دي؟ قواعد العرض الخاصة بيها هتتحذف كمان.', 'حذف')) { await client.deleteScreen(id); await refresh(); toast('اتحذفت'); }
        break;
      case 'preview': previewSheet(id); break;
      case 'copylink': await copy(linkFor(screenById(id).device_id)); break;
      case 'copyplayer': await copy(PLAYER_URL); break;
      case 'newcontent': contentSheet(null); break;
      case 'editcontent': contentSheet(S.content.find((c) => c.id === id)); break;
      case 'togglecontent': {
        const c = S.content.find((x) => x.id === id);
        await client.setContentEnabled(id, !c.enabled); await refresh(); break;
      }
      case 'delcontent': {
        const c = S.content.find((x) => x.id === id);
        if (await askConfirm('تحذف المحتوى ده نهائيًا؟', 'حذف')) { await client.deleteContent(id, c.file); await refresh(); toast('اتحذف'); }
        break;
      }
      case 'ren': {
        const kind = t.dataset.kind;
        const cur = S[kind].find((x) => x.id === id);
        const name = await askPrompt('الاسم الجديد:', cur.name);
        if (name !== null && name.trim() !== cur.name) {
          await client.renameNamed(kind, id, Core.cleanName(name, kind === 'branches' ? 'اسم الفرع' : 'اسم المكان')); await refresh();
        }
        break;
      }
      case 'del':
        if (await askConfirm('تحذف؟', 'حذف')) { await client.deleteNamed(t.dataset.kind, id); await refresh(); toast('اتحذف'); }
        break;
      default:
    }
  } catch (err) { fail(err); }
});
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-addform]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.addform;
  try {
    await client.addNamed(kind, Core.cleanName(f.querySelector('input').value, kind === 'branches' ? 'اسم الفرع' : 'اسم المكان'));
    await refresh();
  } catch (err) { fail(err); }
});

// حالة الاتصال والأكواد الجديدة تتحدّث تلقائيًا وأنت على تبويب الشاشات
setInterval(async () => {
  if (!S || sheetOpen || document.hidden || tab !== 'screens' || document.querySelector('.modal')) return;
  try {
    const live = await client.loadLive();
    if (!S || sheetOpen || tab !== 'screens' || document.querySelector('.modal')) return;
    S.screens = live.screens; S.pending = live.pending;
    render();
  } catch (e) { if (e.kind === 'auth') fail(e); }
}, LIVE_REFRESH_MS);

boot();
</script>
</body>
</html>
